on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

name: check

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check versions.json
        run: node scripts/check-versions.mjs
